name: Publish NuGet Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version to publish
        required: true
      package_release_notes:
        description: Release notes to embed in the NuGet package
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          path: ~/.nuget/packages

      # ---------------------------
      # Resolve version safely
      # ---------------------------
      - name: Resolve package version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.package_version }}"
          fi

          VERSION="${VERSION#v}"

          if [ -z "$VERSION" ]; then
            echo "Package version is required" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      # ---------------------------
      # Capture release notes safely
      # ---------------------------
      - name: Capture release notes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            printf "%s" "${{ github.event.release.body }}" > release_notes.txt
          else
            printf "%s" "${{ inputs.package_release_notes }}" > release_notes.txt
          fi

          {
            echo "PACKAGE_RELEASE_NOTES<<EOF"
            cat release_notes.txt
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test Komento.slnx --no-build -c Release

      # ---------------------------
      # Pack (safe + robust)
      # ---------------------------
      - name: Pack
        shell: bash
        run: |
          shopt -s globstar nullglob
          mkdir -p .artifacts

          for project in src/**/*.csproj; do
            if grep -Eq '<IsPackable>\s*false\s*</IsPackable>' "$project"; then
              echo "Skipping non-packable project: $project"
              continue
            fi

            echo "Packing: $project"

            dotnet pack "$project" \
              --no-build \
              -c Release \
              -o .artifacts \
              -p:PackageVersion="$PACKAGE_VERSION" \
              -p:PackageReleaseNotes="$PACKAGE_RELEASE_NOTES"
          done

      # ---------------------------
      # Push packages
      # ---------------------------
      - name: Push NuGet packages
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push ".artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push symbol packages
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push ".artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate